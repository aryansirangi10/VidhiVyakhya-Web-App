version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: vidhi_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vidhi_frontend_prod
    environment:
      - NODE_ENV=production
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidhi_backend_prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - DATABASE_URL=postgresql://vidhi_user:vidhi_password@db:5432/vidhi_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: pgvector/pgvector:pg15
    container_name: vidhi_db_prod
    environment:
      POSTGRES_USER: vidhi_user
      POSTGRES_PASSWORD: vidhi_password
      POSTGRES_DB: vidhi_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: vidhi_redis_prod
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    restart: always

volumes:
  postgres_prod_data:
  redis_prod_data:
