    // --- GLOSSARY DICTIONARY ---
    const GLOSSARY = {
      "Standard Deduction": "A flat deduction allowed from gross salary income before computing taxable income.",
      "Assessment Year": "The year in which the income earned in the previous financial year is assessed and taxed.",
      "Section 115BAC": "Special tax regime providing lower tax rates for individuals not claiming specified exemptions/deductions.",
      "LTCG": "Long-Term Capital Gains. Profits earned on sale of capital assets held beyond specified holding periods.",
      "Cess": "An additional tax levied by the government for specific public health and education purposes (4%)."
    };

    // --- TAX ENGINE CALCULATIONS ---
    function calculateTaxNewRegimeOldSlabs(taxableIncome) {
      let tax = 0;
      if (taxableIncome <= 300000) return 0;
      if (taxableIncome > 300000) tax += Math.min(300000, taxableIncome - 300000) * 0.05;
      if (taxableIncome > 600000) tax += Math.min(300000, taxableIncome - 600000) * 0.10;
      if (taxableIncome > 900000) tax += Math.min(300000, taxableIncome - 900000) * 0.15;
      if (taxableIncome > 1200000) tax += Math.min(300000, taxableIncome - 1200000) * 0.20;
      if (taxableIncome > 1500000) tax += (taxableIncome - 1500000) * 0.30;
      return tax;
    }

    function calculateTaxNewRegimeRevisedSlabs(taxableIncome) {
      let tax = 0;
      if (taxableIncome <= 300000) return 0;
      if (taxableIncome > 300000) tax += Math.min(400000, taxableIncome - 300000) * 0.05;
      if (taxableIncome > 700000) tax += Math.min(300000, taxableIncome - 700000) * 0.10;
      if (taxableIncome > 1000000) tax += Math.min(2000000, taxableIncome - 1000000) * 0.15;
      if (taxableIncome > 1200000) tax += Math.min(300000, taxableIncome - 1200000) * 0.20;
      if (taxableIncome > 1500000) tax += (taxableIncome - 1500000) * 0.30;
      return tax;
    }

    function evaluateImpact(bill, profile) {
      const { annual_income, employment, tax_regime, equity_ltcg = 0 } = profile;
      let total_impact = 0;
      let triggered_rules = [];
      let explanation = "";

      if (bill.id === 1 && tax_regime === 'new') {
        const isSalaried = employment === 'salaried';
        
        let stdDeductionSavings = 0;
        if (isSalaried) {
          const marginalRate = annual_income > 1500000 ? 0.30 : annual_income > 1200000 ? 0.20 : annual_income > 1000000 ? 0.15 : annual_income > 700000 ? 0.10 : 0.05;
          stdDeductionSavings = 25000 * marginalRate * 1.04;
          total_impact += stdDeductionSavings;

          triggered_rules.push({
            ...bill.rules[0],
            impact: stdDeductionSavings,
            explanation: `Increased Standard Deduction from ₹50,000 to ₹75,000 saves ₹${Math.round(stdDeductionSavings).toLocaleString('en-IN')}.`
          });
        }

        const oldTaxable = Math.max(0, annual_income - (isSalaried ? 50000 : 0));
        const newTaxable = Math.max(0, annual_income - (isSalaried ? 75000 : 0));

        const oldTax = calculateTaxNewRegimeOldSlabs(oldTaxable) * 1.04;
        const newTax = calculateTaxNewRegimeRevisedSlabs(newTaxable) * 1.04;

        const slabSavings = (oldTax - newTax) - (isSalaried ? stdDeductionSavings : 0);
        total_impact += Math.max(0, slabSavings);

        triggered_rules.push({
          ...bill.rules[1],
          impact: Math.max(0, slabSavings),
          explanation: `Revised tax slabs under Section 115BAC save ₹${Math.round(Math.max(0, slabSavings)).toLocaleString('en-IN')}.`
        });

        explanation = `Total estimated tax savings: ₹${Math.round(total_impact).toLocaleString('en-IN')} under revised New Tax Regime rules.`;
      } 
      else if (bill.id === 3 && equity_ltcg > 0) {
        const oldExemption = 100000;
        const newExemption = 125000;
        
        const oldLtcgTax = Math.max(0, equity_ltcg - oldExemption) * 0.10 * 1.04;
        const newLtcgTax = Math.max(0, equity_ltcg - newExemption) * 0.125 * 1.04;
        
        const ltcgImpact = oldLtcgTax - newLtcgTax; // Negative means increased tax cost
        total_impact = ltcgImpact;

        triggered_rules.push({
          ...bill.rules[0],
          impact: ltcgImpact,
          explanation: `LTCG tax rate change from 10% to 12.5% with ₹1.25L exemption net impact: ${ltcgImpact >= 0 ? '+' : ''}₹${Math.round(ltcgImpact).toLocaleString('en-IN')}.`
        });

        explanation = `Net LTCG Tax change: ${ltcgImpact >= 0 ? 'Savings of' : 'Additional cost of'} ₹${Math.abs(Math.round(ltcgImpact)).toLocaleString('en-IN')}.`;
      } 
      else {
        explanation = "No direct financial rule matches for your specific profile combination in this bill.";
      }

      return {
        bill_id: bill.id,
        title: bill.title,
        total_impact: Math.round(total_impact),
        explanation,
        triggered_rules
      };
    }

      // Profiles list for side-by-side comparison
      const profiles = [
        { name: "Self (Salaried)", income, employment, regime, age, equityLtcg },
        { name: "Spouse (Business)", income: 1800000, employment: 'business', regime: 'new', age: 30, equityLtcg: 0 },
        { name: "Senior Parent", income: 800000, employment: 'salaried', regime: 'old', age: 67, equityLtcg: 50000 }

      const currentProfile = useMemo(() => ({
        annual_income: Number(income),
        employment,
        tax_regime: regime,
        age: Number(age),
        equity_ltcg: Number(equityLtcg)
      }), [income, employment, regime, age, equityLtcg]);

      const evaluation = useMemo(() => evaluateImpact(currentBill, currentProfile), [currentBill, currentProfile]);

      // Calculate breakdown metrics
      const baseTaxImpact = Math.round(evaluation.total_impact * 0.9615);
      const cessImpact = evaluation.total_impact - baseTaxImpact;

      return (

                </div>
              </div>
              <div className="flex items-center gap-4 text-sm text-slate-300">
                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-800 text-xs text-indigo-300 font-medium">

                  Local Calculation Engine (<10ms)
                </span>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-6 py-8 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            {/* LEFT COLUMN: Bill Selector & Metadata */}
            <div className="lg:col-span-4 space-y-6">
              
              {/* Bill List */}
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">

                  <h2 className="text-sm font-semibold text-slate-700 uppercase tracking-wider">Parliamentary Bills</h2>
                  <span className="text-xs font-semibold px-2 py-0.5 rounded bg-slate-200 text-slate-600">{BILLS_DATA.length} Bills</span>
                </div>
                <div className="divide-y divide-slate-100">
                  {BILLS_DATA.map(bill => (
                    <button

                      className={`w-full text-left p-4 transition-colors flex flex-col gap-1.5 ${

              {/* IMPACT RESULT CARD */}

                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-5 rounded-xl bg-slate-900 text-white">
                  <div>
                    <span className="text-xs text-slate-400 uppercase tracking-wider font-medium">Estimated Net Rupee Impact</span>
                    <div className="flex items-baseline gap-2 mt-1">
                      <span className={`text-3xl font-extrabold font-mono tracking-tight ${evaluation.total_impact >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {evaluation.total_impact >= 0 ? '+' : ''}₹{Math.abs(evaluation.total_impact).toLocaleString('en-IN')}

                      <span className="text-xs text-slate-400 font-normal">
                        {evaluation.total_impact >= 0 ? 'Estimated Tax Savings' : 'Estimated Tax Increase'}

                    <div className="space-y-2">
                      <div>
                        <div className="flex justify-between text-xs text-slate-600 mb-1">
                          <span>Base Income Tax Component</span>
                          <span className="font-mono font-medium">₹{Math.abs(baseTaxImpact).toLocaleString('en-IN')}</span>
                        </div>

                          <span className="font-mono font-medium">₹{Math.abs(cessImpact).toLocaleString('en-IN')}</span>
                        </div>
                        <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                          <div className="bg-emerald-500 h-full rounded-full transition-all duration-300" style={{ width: '8%' }}></div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* TRACE EXPLANATION WITH GLOSSARY TOOLTIPS */}
                <div className="space-y-3">
                  <h4 className="text-xs font-semibold text-slate-700 uppercase tracking-wider">Calculation Trace & Glossary Terms</h4>
                  
                  <div className="p-4 bg-amber-50/50 border border-amber-200/60 rounded-xl text-xs text-slate-700 leading-relaxed relative">
                    <p className="font-medium text-slate-900 mb-2">{evaluation.explanation}</p>
                    <p className="text-slate-600">
                      Hover over terms like{" "}
                      {Object.keys(GLOSSARY).map((term, i) => (
                        <span key={i}>

                            onMouseEnter={() => setActiveTooltip(term)}

                            {term}
                          </span>
                          {i < Object.keys(GLOSSARY).length - 1 ? ", " : "."}
                        </span>
                      ))}
                    </p>

                    {/* Popover Tooltip */}
                    {activeTooltip && (
                      <div className="absolute left-6 bottom-12 w-72 p-3 bg-slate-900 text-white rounded-lg shadow-xl border border-slate-700 text-xs z-50 animate-in fade-in duration-150">
                        <span className="font-semibold text-indigo-300 block mb-1">{activeTooltip}</span>
                        <p className="text-slate-300 text-[11px] leading-normal">{GLOSSARY[activeTooltip]}</p>
                      </div>
                    )}
                  </div>
                </div>

                {/* CLAUSE CITATION CARDS */}
                <div className="space-y-3">
                  <h4 className="text-xs font-semibold text-slate-700 uppercase tracking-wider">Grounding Clause Citations</h4>
                  
                  {evaluation.triggered_rules.length > 0 ? (
                    evaluation.triggered_rules.map((rule, idx) => (
                      <div key={idx} className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-semibold px-2 py-0.5 rounded bg-indigo-100 text-indigo-800 font-mono">
                            {rule.clause_number}
                          </span>
                          <span className="text-[11px] font-medium text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">
                            ✓ Verified ({(rule.confidence * 100).toFixed(0)}% Confidence)
                          </span>
                        </div>
                        <p className="text-xs text-slate-800 italic bg-white p-3 rounded border border-slate-100">
                          "{rule.clause_text}"
                        </p>
                        <p className="text-xs font-medium text-indigo-900">{rule.explanation}</p>
                      </div>
                    ))
                  ) : (
                    <div className="p-4 text-center text-xs text-slate-500 bg-slate-50 rounded-xl border border-slate-200">
                      No clause citations triggered for the selected profile parameters.
                    </div>
                  )}
                </div>

              </div>

              {/* MULTI-PROFILE COMPARISON DECK */}
              <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
                <h3 className="text-xs font-semibold text-slate-700 uppercase tracking-wider">Family & Entities Profile Comparison</h3>
                
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  {profiles.map((p, idx) => {
                    const profImpact = evaluateImpact(currentBill, {
                      annual_income: p.income,
                      employment: p.employment,
                      tax_regime: p.regime,
                      age: p.age,
                      equity_ltcg: p.equityLtcg
                    });
                    
                    return (
                      <div key={idx} className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                        <span className="text-xs font-semibold text-slate-900 block">{p.name}</span>
                        <span className="text-[11px] text-slate-500 block">
                          ₹{(p.income / 100000).toFixed(1)}L • {p.employment}
                        </span>
                        <div className="pt-2 border-t border-slate-200">
                          <span className={`text-base font-bold font-mono ${profImpact.total_impact >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                            {profImpact.total_impact >= 0 ? '+' : ''}₹{Math.abs(profImpact.total_impact).toLocaleString('en-IN')}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

            </div>

          </main>

          <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
            VidhiVyakhya (विधिव्याख्या) — Personal Financial Law Impact Calculator • Grounded in Parliamentary Bill Text
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
